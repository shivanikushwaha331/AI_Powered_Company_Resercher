[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-company-research-assistant-backend"
version = "0.1.0"
description = "Backend for AI Company Research Assistant powered by FastAPI and Python 3.12+"
readme = "../README.md"
requires-python = ">=3.12"
dependencies = []

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q"
asyncio_mode = "auto"
testpaths = [
    "tests",
]

[tool.black]
line-length = 88
target-version = ['py312']

[tool.isort]
profile = "black"
line_length = 88
